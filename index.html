<script>
const $=s=>document.querySelector(s);
const sidebar=$('#sidebar'),overlay=$('#overlay'),promptBox=$('#prompt'),sendBtn=$('#sendBtn'),welcome=$('#welcome'),messages=$('#messages'),scroll=$('#chatScroll'),history=$('#history'),toast=$('#toast');
let chatCount=0, activeTitle='New chat', toastTimer, currentModel='Apex 3.1', chatLocked=false, currentHistoryItem=null, archivedChats=[];
// Core chat state required by the send handler.
let conversation = [];
let requestInProgress = false;
const STORAGE_KEY='lark_browser_data_v1';
let savedChats=[]; let activeChatId=null;
function persistState(){try{const active=savedChats.find(c=>c.id===activeChatId);if(active){active.title=activeTitle;active.messages=conversation;active.model=currentModel;active.pinned=!!currentHistoryItem?.classList.contains('pinned');}localStorage.setItem(STORAGE_KEY,JSON.stringify({chats:savedChats,activeChatId,currentModel,chatLocked:false}));}catch(e){notify('Browser storage is full or unavailable. Export your chats or clear old data.')}}
function renderHistory(){history.innerHTML='';const sorted=[...savedChats].sort((a,b)=>Number(!!b.pinned)-Number(!!a.pinned)||b.updatedAt-a.updatedAt);for(const chat of sorted){if(chat.archived)continue;const item=document.createElement('button');item.className='history-item'+(chat.pinned?' pinned':'');item.textContent=chat.title||'New chat';item.title=item.textContent;item.dataset.chatId=chat.id;item.addEventListener('click',()=>loadChat(chat.id));history.appendChild(item);if(chat.id===activeChatId)currentHistoryItem=item;}}
function loadChat(id){if(requestInProgress){notify('Wait for the current response to finish first');return}const chat=savedChats.find(c=>c.id===id);if(!chat)return;activeChatId=id;activeTitle=chat.title;conversation=Array.isArray(chat.messages)?chat.messages:[];currentModel=chat.model||currentModel;updateModelMenu();chatLocked=false;promptBox.disabled=false;$('#lockBanner')?.classList.remove('show');messages.innerHTML='';for(const m of conversation){if(m.role==='user')addMessage(m.content,'user');else if(m.role==='assistant')addMessage(m.content,'assistant')}messages.hidden=conversation.length===0;welcome.hidden=conversation.length>0;welcome.style.display=conversation.length>0?'none':'';currentHistoryItem=[...history.children].find(x=>x.dataset.chatId===id)||null;renderHistory();scroll.scrollTop=scroll.scrollHeight;persistState();if(innerWidth<=760)closeMobile()}
function restoreState(){try{const raw=localStorage.getItem(STORAGE_KEY);if(!raw)return;const data=JSON.parse(raw);savedChats=Array.isArray(data.chats)?data.chats:[];currentModel=data.currentModel||currentModel;chatCount=savedChats.length;updateModelMenu();renderHistory();if(data.activeChatId&&savedChats.some(c=>c.id===data.activeChatId))loadChat(data.activeChatId);}catch(e){console.warn('LARK saved data could not be restored',e)}}
window.addEventListener('pagehide',persistState);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')persistState()});
const MODEL_IDS = {
  'Apex 3.1': 'google/gemini-3.8-flash',
  'Apex 3.8': 'anthropic/claude-sonnet-5-5',
  'Dirt nobe': 'openai/gpt-6-sol',
  'Lark max': 'openai/gpt-6-astra'
};
function notify(msg){toast.textContent=msg;toast.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('show'),2300)}
function fit(){promptBox.style.height='auto';promptBox.style.height=Math.min(promptBox.scrollHeight,200)+'px';sendBtn.disabled=!promptBox.value.trim()}
promptBox.addEventListener('input',fit);
promptBox.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}});
function newChat(){if(requestInProgress){notify('Wait for the current response to finish first');return}persistState();activeChatId=null;activeTitle='New chat';conversation=[];chatLocked=false;promptBox.disabled=false;$('#lockBanner')?.classList.remove('show');currentHistoryItem=null;welcome.hidden=false;welcome.style.display='';messages.hidden=true;messages.innerHTML='';promptBox.value='';fit();$('#modelMenu').classList.remove('open');$('#chatOptionsMenu').classList.remove('open');if(innerWidth<=760)closeMobile();persistState();promptBox.focus()}
$('#newChatBtn').addEventListener('click',newChat);
$('#collapseBtn')?.addEventListener('click',()=>{if(innerWidth<=760)closeMobile();else sidebar.classList.add('collapsed')});
$('#mobileMenu').addEventListener('click',()=>{sidebar.classList.add('open');overlay.classList.add('show')});
$('#sidebarToggle').addEventListener('click',()=>{if(innerWidth<=760){sidebar.classList.add('open');overlay.classList.add('show')}else sidebar.classList.toggle('collapsed')});
function closeMobile(){sidebar.classList.remove('open');overlay.classList.remove('show')}
overlay.addEventListener('click',closeMobile);
$('#modelBtn').addEventListener('click',()=>$('#modelMenu').classList.toggle('open'));
document.addEventListener('click',e=>{if(!e.target.closest('#modelBtn')&&!e.target.closest('#modelMenu'))$('#modelMenu').classList.remove('open')});
function updateModelMenu(){
  document.querySelectorAll('.model-option').forEach(b=>{
    const selected=b.dataset.model===currentModel;
    b.classList.toggle('selected',selected);
    const check=b.querySelector('.check');
    if(check) check.textContent=selected?'✓':'';
    b.setAttribute('aria-pressed',String(selected));
  });
  $('#modelBtn').innerHTML=currentModel+' <span class="subtle">▾</span>';
}
document.querySelectorAll('.model-option').forEach(b=>b.addEventListener('click',()=>{
  currentModel=b.dataset.model;
  if(typeof larkSettings!=='undefined' && larkSettings.rememberLastModel!==false){larkSettings.defaultModel=currentModel;try{localStorage.setItem('lark_settings_v1',JSON.stringify(larkSettings))}catch(e){}}
  updateModelMenu();
  $('#modelMenu').classList.remove('open');
  const id=MODEL_IDS[currentModel];
  persistState();notify('Selected '+currentModel+' · Puter.js routing active');
}));
document.querySelectorAll('.suggestion').forEach(b=>b.addEventListener('click',()=>{promptBox.value=b.dataset.prompt;fit();promptBox.focus()}));
function escapeHTML(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function renderAssistantMarkdown(raw){
  const source=String(raw??'');
  // KaTeX-friendly delimiters: keep math delimiters for auto-render.
  let html;
  try{
    if(window.marked){
      marked.setOptions({gfm:true,breaks:false});
      html=marked.parse(source,{async:false});
    }else{
      html='<p>'+escapeHTML(source).replace(/\n/g,'<br>')+'</p>';
    }
    html=window.DOMPurify?DOMPurify.sanitize(html,{USE_PROFILES:{html:true}}):html;
  }catch(e){html='<p>'+escapeHTML(source).replace(/\n/g,'<br>')+'</p>';}
  const wrapper=document.createElement('div');
  wrapper.innerHTML=html;
  if(window.renderMathInElement){
    try{renderMathInElement(wrapper,{delimiters:[{left:'$$',right:'$$',display:true},{left:'\\[',right:'\\]',display:true},{left:'$',right:'$',display:false},{left:'\\(',right:'\\)',display:false}],throwOnError:false,strict:'ignore'});}catch(e){}
  }
  wrapper.querySelectorAll('a').forEach(a=>{a.target='_blank';a.rel='noopener noreferrer';});
  wrapper.querySelectorAll('pre').forEach(pre=>{
    const code=pre.querySelector('code');if(!code)return;
    const btn=document.createElement('button');btn.className='code-copy';btn.type='button';btn.textContent='Copy code';
    btn.addEventListener('click',async()=>{try{await navigator.clipboard.writeText(code.innerText);btn.textContent='Copied';setTimeout(()=>btn.textContent='Copy code',1200)}catch{notify('Copy is unavailable in this browser')}});
    pre.style.paddingTop='42px';pre.appendChild(btn);
  });
  return wrapper.innerHTML;
}
function addMessage(text,who){
  const article=document.createElement('article');
  article.className='message '+who;
  if(who==='user'){
    const bubble=document.createElement('div');
    bubble.className='bubble';
    bubble.textContent=text;
    article.appendChild(bubble);
  }else{
    const mark=document.createElement('div');
    mark.className='avatar-mini assistant-mark';
    mark.textContent='✳';
    const body=document.createElement('div');
    body.className='bubble';
    const textEl=document.createElement('div');
    textEl.className='message-text';
    // Render Markdown safely; fall back to readable plain text if libraries are offline.
    textEl.innerHTML=renderAssistantMarkdown(text);
    const actions=document.createElement('div');
    actions.className='message-actions';
    actions.innerHTML='<button title="Copy" class="copy" aria-label="Copy"><svg viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/></svg></button><button title="Good response" aria-label="Good response"><svg viewBox="0 0 24 24"><path d="M7 10v11H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2Zm0 0 5-8a3 3 0 0 1 2 3l-1 5h6a2 2 0 0 1 2 2l-2 7a2 2 0 0 1-2 2H7"/></svg></button><button title="Bad response" aria-label="Bad response"><svg viewBox="0 0 24 24"><path d="M7 14V3H4a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2Zm0 0 5 8a3 3 0 0 0 2-3l-1-5h6a2 2 0 0 0 2-2l-2-7a2 2 0 0 0-2-2H7"/></svg></button>';
    body.append(textEl,actions);
    article.append(mark,body);
    const copy=actions.querySelector('.copy');
    copy.addEventListener('click',async()=>{
      try { await navigator.clipboard.writeText(text); notify('Copied to clipboard'); }
      catch { notify('Could not copy in this browser'); }
    });
  }
  messages.appendChild(article);
  return article;
}
function extractPuterText(response){
  if(typeof response==='string') return response;
  if(response?.message?.content != null){
    const content=response.message.content;
    if(typeof content==='string') return content;
    if(Array.isArray(content)) return content.map(x=>x.text||'').join('\n');
    return String(content);
  }
  if(response?.text != null) return String(response.text);
  return JSON.stringify(response,null,2);
}
function isImageGenerationRequest(text){
  const t=String(text||'').toLowerCase();
  return /\b(generate|create|make|draw|design|render|produce|imagine)\b.{0,65}\b(image|picture|photo|illustration|artwork|wallpaper|logo|poster|thumbnail|visual)\b/.test(t)
    || /\b(image|picture|photo|illustration|artwork|wallpaper|logo|poster|thumbnail)\b.{0,55}\b(generate|create|make|draw|design|render)\b/.test(t)
    || /^(create image|generate image|image generation|make an image)\s*[:：-]?/i.test(t);
}
function extractImagePrompt(text){
  return String(text||'').replace(/^\s*(please\s+)?(generate|create|make|draw|design|render)\s+(me\s+)?(an?\s+)?(image|picture|photo|illustration|artwork|wallpaper|logo|poster|thumbnail)?\s*(of|for|showing|depicting)?\s*[:：-]?\s*/i,'').replace(/^create an image\s*[:：-]?\s*/i,'').trim() || String(text||'').trim();
}
async function sendMessage(){
  const text=promptBox.value.trim();
  if(!text || requestInProgress || chatLocked) return;
  if(!window.puter || !puter.ai){
    notify('Puter.js is not ready. Check your internet connection and reload.');
    return;
  }
  const imageIntent=isImageGenerationRequest(text);
  if(imageIntent && typeof puter.ai.txt2img!=='function'){
    notify('Image generation is unavailable: Puter.js txt2img did not load.');
    return;
  }
  if(!imageIntent && typeof puter.ai.chat!=='function'){
    notify('Puter.js chat is not ready. Check your internet connection and reload.');
    return;
  }
  welcome.hidden=true;
  messages.hidden=false;
  // The welcome cards must disappear completely once the first prompt is sent.
  welcome.style.display="none";
  if(!activeChatId){
    activeTitle=text.length>30?text.slice(0,30)+'…':text;
    activeChatId='chat_'+Date.now()+'_'+Math.random().toString(36).slice(2,8);
    const chat={id:activeChatId,title:activeTitle,messages:[],model:currentModel,pinned:false,archived:false,updatedAt:Date.now()};savedChats.push(chat);
    renderHistory();currentHistoryItem=[...history.children].find(x=>x.dataset.chatId===activeChatId)||null;chatCount=savedChats.length;
  }
  addMessage(text,'user');
  conversation.push({role:'user',content:text});
  persistState();
  promptBox.value='';
  fit();
  scroll.scrollTop=scroll.scrollHeight;
  const waiting=document.createElement('article');
  waiting.className='message';
  waiting.innerHTML='<div class="avatar-mini assistant-mark">✳</div><div class="typing"><i></i><i></i><i></i></div>';
  messages.appendChild(waiting);
  scroll.scrollTop=scroll.scrollHeight;
  requestInProgress=true;
  sendBtn.disabled=true;
  promptBox.disabled=true;
  try{
    if(imageIntent){
      waiting.querySelector('.typing').innerHTML='<span class="image-generation-status">Creating your image with Nano Banana 2.1…</span>';
      const imageElement=await puter.ai.txt2img(extractImagePrompt(text),{model:'google/gemini-nano-banana-2.1'});
      waiting.remove();
      const article=document.createElement('article');article.className='message';
      const avatar=document.createElement('div');avatar.className='avatar-mini assistant-mark';avatar.textContent='✳';
      const body=document.createElement('div');body.className='message-body';
      const label=document.createElement('div');label.className='message-text';label.textContent='Here is your generated image.';body.appendChild(label);
      if(imageElement instanceof HTMLElement){imageElement.classList.add('generated-image');imageElement.alt='AI-generated image';body.appendChild(imageElement)}else{throw new Error('Puter returned an unsupported image result.');}
      article.append(avatar,body);messages.appendChild(article);conversation.push({role:'assistant',content:'Generated an image using google/gemini-nano-banana-2.1 for prompt: '+extractImagePrompt(text)});persistState();
    }else{
      const model=MODEL_IDS[currentModel] || MODEL_IDS['Apex 3.1'];
      const response=await puter.ai.chat(conversation, {model});
      const answer=extractPuterText(response).trim() || 'The model returned an empty response.';
      conversation.push({role:'assistant',content:answer});
      waiting.remove();
      addMessage(answer,'assistant');persistState();
    }
  }catch(error){
    waiting.remove();
    const errorText=(imageIntent?'Image generation failed. ':'Sorry, the request to Puter.js failed. ')+'\n\n'+(error?.message||String(error))+'\n\n'+(imageIntent?'Check Puter.js access and Nano Banana 2.1 model availability, then try again.':'Check your internet connection, model ID, and Puter.js permissions, then try again.');
    addMessage(errorText,'assistant');
    conversation.pop();persistState();
  }finally{
    requestInProgress=false;
    promptBox.disabled=false;
    fit();
    promptBox.focus();
    scroll.scrollTop=scroll.scrollHeight;persistState();
  }
}

});

<script>
/* Settings implementation: all preferences autosave locally. */
const SETTINGS_KEY='lark_settings_v1';

 {id:'general',name:'General',icon:'◉',desc:'Language and conversation behaviour',groups:[['Language',{key:'uiLanguage',label:'Interface language',type:'select',options:['Auto','English','Hinglish','Hindi'],desc:'Controls LARK interface labels where translations are available.'},{key:'responseLanguage',label:'AI response language',type:'select',options:['Auto','English','Hinglish','Hindi'],desc:'Adds a language preference to future AI requests.'},{key:'enterToSend',label:'Enter to send',type:'toggle',desc:'Enter sends; Shift + Enter inserts a new line.'},{key:'autoScroll',label:'Auto-scroll',type:'toggle',desc:'Follow the latest message while the conversation updates.'},{key:'confirmDelete',label:'Confirm before deleting',type:'toggle',desc:'Ask before deleting a chat or clearing history.'},{key:'markdown',label:'Formatted responses',type:'toggle',desc:'Render Markdown, code, tables and equations when supported.'}]]},

 {id:'privacy',name:'Data & Privacy',icon:'⬡',desc:'Local storage, export and deletion',groups:[['Your data',{key:'saveChats',label:'Save chats on this device',type:'toggle',desc:'When off, LARK stops writing future chat updates to local history; existing saved data remains.'},{key:'exportJson',label:'Export chats',type:'action',action:'exportJson'},{key:'exportText',label:'Export as text',type:'action',action:'exportText'},{key:'clearHistory',label:'Clear all chat history',type:'action',action:'clearHistory',danger:true},{key:'storageInfo',label:'Storage and privacy',type:'info',text:'Chats and preferences are local to this browser origin. Clearing site data or changing devices can make them unavailable.'}],['Device security',{key:'deviceAuth',label:'Device authentication',type:'action',action:'deviceAuth',desc:'Use only if a real browser/device authentication API is available.'}]]},

const settingsDefaults={uiLanguage:'Auto',responseLanguage:'Auto',enterToSend:true,autoScroll:true,confirmDelete:true,markdown:true,rememberLastModel:true,defaultModel:'Apex 3.1',responseLength:'Balanced',reasoning:'Standard',retryFailed:true,fallback:false,personality:'Friendly',customInstructions:'',memoryEnabled:true,saveChats:true,webSearch:true,fileUploads:true,pdfCreator:true,dataAnalysis:false,imageGeneration:false,fontSize:'Medium',chatWidth:'Comfortable',messageSpacing:'Relaxed',codeFontSize:'Medium',reducedMotion:false,sidebarDefault:'Expanded',voiceInput:true,spokenReplies:true,voiceName:'System default',speechSpeed:'Normal',voiceLanguage:'Auto'};
let larkSettings={...settingsDefaults};try{const old=JSON.parse(localStorage.getItem(SETTINGS_KEY)||'{}');larkSettings={...larkSettings,...old}}catch(e){}
let activeSettingsCategory='general';const settingsShell=$('#settingsShell'),settingsBackdrop=$('#settingsBackdrop'),settingsNav=$('#settingsNav'),settingsContent=$('#settingsContent');
function saveSettings(){try{localStorage.setItem(SETTINGS_KEY,JSON.stringify(larkSettings));$('#settingsStatus').textContent='All changes saved on this browser.'}catch(e){$('#settingsStatus').textContent='Could not save settings. Browser storage may be full or unavailable.';notify('Settings could not be saved')}}

function closeSettings(){settingsShell.classList.remove('open','mobile-detail');settingsBackdrop.classList.remove('open');document.body.style.overflow='';}
function renderSettingsNav(filter=''){settingsNav.innerHTML='';const q=filter.trim().toLowerCase();let shown=0;for(const cat of settingsDefs){const searchable=(cat.name+' '+cat.desc+' '+cat.groups.flatMap(g=>(Array.isArray(g[1])?g[1]:g.slice(1)).map(x=>x.label+' '+(x.desc||'')+' '+(x.text||'')+' '+(x.options||[]).join(' '))).join(' ')).toLowerCase();if(q&&!searchable.includes(q))continue;shown++;const b=document.createElement('button');b.className=cat.id===activeSettingsCategory?'active':'';b.innerHTML='<span>'+cat.icon+'</span><span>'+cat.name+'</span>';b.addEventListener('click',()=>showSettingsCategory(cat.id));settingsNav.appendChild(b)}if(!shown)settingsNav.innerHTML='<div class="settings-empty">No matching settings</div>'}
function showSettingsCategory(id){const cat=settingsDefs.find(c=>c.id===id)||settingsDefs[0];activeSettingsCategory=cat.id;$('#settingsHeading').textContent=cat.name;$('#settingsSubheading').textContent=cat.desc;settingsShell.classList.toggle('mobile-detail',innerWidth<=760);renderSettingsNav($('#settingsSearch').value);settingsContent.innerHTML='';const q=$('#settingsSearch').value.trim().toLowerCase();for(const groupDef of cat.groups){const group=groupDef[0];const items=Array.isArray(groupDef[1])?groupDef[1]:groupDef.slice(1);const matches=items.filter(it=>!q||(it.label+' '+(it.desc||'')+' '+(it.text||'')+' '+(it.options||[]).join(' ')).toLowerCase().includes(q));if(!matches.length)continue;const h=document.createElement('div');h.className='settings-section-title';h.textContent=group;settingsContent.appendChild(h);for(const item of matches)settingsContent.appendChild(buildSettingRow(item))}if(!settingsContent.children.length)settingsContent.innerHTML='<div class="settings-empty">No matching settings in this category.</div>'}
function buildSettingRow(item){const row=document.createElement('div');row.className='setting-row';const copy=document.createElement('div');copy.className='setting-copy';copy.innerHTML='<strong>'+escapeSettingsText(item.label)+'</strong>'+(item.desc?'<small>'+escapeSettingsText(item.desc)+'</small>':'');row.appendChild(copy);let control;if(item.type==='toggle'){control=document.createElement('input');control.type='checkbox';control.className='setting-control';control.checked=!!(item.key in larkSettings?larkSettings[item.key]:settingsDefaults[item.key]);control.setAttribute('aria-label',item.label);control.addEventListener('change',()=>{larkSettings[item.key]=control.checked;saveSettings();applySetting(item.key,control.checked)})}else if(item.type==='select'){control=document.createElement('select');control.className='setting-control';(item.options||[]).forEach(v=>{const o=document.createElement('option');o.value=v;o.textContent=v;control.appendChild(o)});control.value=larkSettings[item.key]??settingsDefaults[item.key]??item.options[0];control.addEventListener('change',()=>{larkSettings[item.key]=control.value;saveSettings();applySetting(item.key,control.value)})}else if(item.type==='textarea'){control=document.createElement('textarea');control.className='setting-control textarea';control.value=larkSettings[item.key]||'';control.placeholder='Write your instructions...';control.addEventListener('change',()=>{larkSettings[item.key]=control.value;saveSettings()})}else if(item.type==='action'){control=document.createElement('button');control.className='setting-action'+(item.danger?' danger':'');control.textContent=item.action==='resetSettings'?'Reset':item.action==='clearHistory'?'Clear history':item.action==='clearMemory'?'Clear memory':item.action==='exportJson'?'Download JSON':item.action==='exportText'?'Download text':item.action==='deviceAuth'?'Check support':item.action==='diagnostics'?'Run checks':'Open';control.addEventListener('click',()=>runSettingAction(item.action))}else{control=document.createElement('div');control.className='setting-control';control.style.maxWidth='280px';control.textContent=item.text||'Not connected'}row.appendChild(control);return row}
function escapeSettingsText(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function applySetting(key,value){if(key==='defaultModel'){currentModel=value;updateModelMenu();persistState()}if(key==='memoryEnabled'){memoryEnabled=!!value;localStorage.setItem('lark_memory_enabled',String(memoryEnabled));paintToggle('memoryToggle','memorySwitch',memoryEnabled)}if(key==='webSearch'){webSearchEnabled=!!value;localStorage.setItem('lark_web_search_enabled',String(webSearchEnabled));paintToggle('webSearchToggle','webSearchSwitch',webSearchEnabled)}if(key==='enterToSend')notify(value?'Enter sends messages':'Use the send button to send messages');if(key==='saveChats')notify(value?'Chat autosave enabled':'Chat autosave disabled; existing chats remain saved');if(key==='reducedMotion')document.documentElement.style.scrollBehavior=value?'auto':'smooth';if(key==='fontSize'){messages.style.fontSize=({Small:'14px',Medium:'16px',Large:'18px'})[value]}if(key==='chatWidth'){messages.style.maxWidth=({Compact:'640px',Comfortable:'800px',Wide:'1100px'})[value];messages.style.marginInline='auto'}if(key==='sidebarDefault'){sidebar.classList.toggle('collapsed',value==='Collapsed'&&innerWidth>760)}if(key==='markdown')notify(value?'Formatted responses enabled':'Formatting preference saved')}
function downloadSettingsFile(name,type,content){const blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function runSettingAction(action){if(action==='exportJson'){downloadSettingsFile('lark-chats.json','application/json',JSON.stringify(savedChats,null,2));notify('Chat export prepared')}else if(action==='exportText'){downloadSettingsFile('lark-chats.txt','text/plain',savedChats.map(c=>'# '+c.title+'\n'+(c.messages||[]).map(m=>(m.role||'')+': '+(m.content||'')).join('\n')).join('\n\n---\n\n'));notify('Text export prepared')}else if(action==='clearHistory'){if(larkSettings.confirmDelete!==false&&!confirm('Clear all saved chat history from this browser? Your settings and memory preferences will remain.'))return;savedChats=[];activeChatId=null;conversation=[];activeTitle='New chat';currentHistoryItem=null;messages.innerHTML='';messages.hidden=true;welcome.hidden=false;welcome.style.display='';renderHistory();persistState();notify('Local chat history cleared')}else if(action==='clearMemory'){if(!confirm('Clear LARK local memory preferences? Chat history will remain.'))return;larkSettings.memoryEnabled=false;localStorage.setItem('lark_memory_enabled','false');saveSettings();notify('Memory preference cleared; chat history preserved');showSettingsCategory('memory')}else if(action==='resetSettings'){if(!confirm('Reset settings to defaults? Chats and memory will be preserved.'))return;larkSettings={...settingsDefaults};saveSettings();applyAllSettings();showSettingsCategory(activeSettingsCategory);notify('Settings reset; chats and memory preserved')}else if(action==='deviceAuth'){notify('Device authentication is not configured in this single-file build. No security lock was enabled.')}else if(action==='installInfo'){notify('Use your browser menu → Add to Home screen. PWA installability depends on site configuration.')}else if(action==='diagnostics'){const checks=[['Puter.js',typeof puter!=='undefined'],['Local storage',(()=>{try{localStorage.setItem('__lark_test','1');localStorage.removeItem('__lark_test');return true}catch(e){return false}})()],['Message renderer',!!messages],['Send button',!!sendBtn]];alert('LARK diagnostics\n'+checks.map(x=>x[0]+': '+(x[1]?'Available':'Unavailable')).join('\n'))}}
function applyAllSettings(){for(const [k,v] of Object.entries(larkSettings))applySetting(k,v)}
$('#profileMenu').addEventListener('click',()=>openSettings());$('#settingsClose').addEventListener('click',closeSettings);$('#settingsBackdrop').addEventListener('click',closeSettings);$('#settingsBack').addEventListener('click',()=>{settingsShell.classList.remove('mobile-detail')});$('#settingsSearch').addEventListener('input',()=>{renderSettingsNav($('#settingsSearch').value);showSettingsCategory(activeSettingsCategory)});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&settingsShell.classList.contains('open'))closeSettings()});
// Respect the selected Enter behaviour without changing Shift+Enter newline behaviour.
promptBox.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&larkSettings.enterToSend===false){e.preventDefault();promptBox.value+='\n';fit()}});
// Preserve model selection as the default for the next chat and restore persisted preferences.
const originalNewChat=newChat;newChat=function(){originalNewChat();if(larkSettings.rememberLastModel!==false){updateModelMenu();persistState()}};
applyAllSettings();
