<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ChatGPT-style AI — Puter.js</title>
<style>
:root{--bg:#fff;--panel:#f9f9f9;--sidebar:#f9f9f9;--text:#0d0d0d;--muted:#676767;--line:#e7e7e7;--hover:#ececec;--user:#f4f4f4;--accent:#10a37f;--shadow:0 8px 30px #00000012}
*{box-sizing:border-box}body{margin:0;font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);height:100dvh;overflow:hidden}body.dark{--bg:#212121;--panel:#2f2f2f;--sidebar:#171717;--text:#ececec;--muted:#a5a5a5;--line:#3c3c3c;--hover:#2a2a2a;--user:#303030;--shadow:0 8px 30px #0005}
button,input,textarea{font:inherit}button{cursor:pointer;color:inherit;border:0;background:transparent}button:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}.app{height:100dvh;display:flex}.sidebar{width:260px;background:var(--sidebar);display:flex;flex-direction:column;padding:10px 12px;flex-shrink:0;transition:width .2s,transform .2s;z-index:10}.side-top{display:flex;align-items:center;justify-content:space-between;padding:4px 2px 20px}.brandmark{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:22px}.icon-btn{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--muted)}.icon-btn:hover,.side-action:hover,.history-item:hover{background:var(--hover);color:var(--text)}.side-action{height:40px;display:flex;align-items:center;gap:11px;padding:0 10px;border-radius:10px;text-align:left;font-size:14px;margin-bottom:3px}.side-action svg{width:19px;height:19px;flex-shrink:0}.history-label{font-size:12px;color:var(--muted);font-weight:600;padding:24px 10px 8px}.history{overflow:auto;flex:1}.history-item{width:100%;text-align:left;padding:10px;border-radius:9px;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.profile{border-top:1px solid var(--line);padding-top:10px;margin-top:8px}.profile button{width:100%;display:flex;align-items:center;gap:10px;text-align:left;padding:8px;border-radius:10px}.avatar{width:30px;height:30px;border-radius:50%;background:#b7d8cb;color:#143b2c;display:grid;place-items:center;font-size:12px;font-weight:700}.profile-name{font-size:13px;font-weight:600}.profile-sub{font-size:11px;color:var(--muted);margin-top:2px}.main{min-width:0;flex:1;display:flex;flex-direction:column;position:relative}.topbar{height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;flex-shrink:0}.top-left,.top-right{display:flex;align-items:center;gap:8px}.mobile-menu{display:none}.model-btn{font-size:18px;font-weight:600;padding:7px 8px;border-radius:9px;display:flex;gap:7px;align-items:center}.model-btn:hover{background:var(--hover)}.model-btn small{font-size:12px;color:var(--muted);font-weight:500}.top-action{border:1px solid var(--line);border-radius:999px;padding:8px 13px;font-size:13px;display:flex;align-items:center;gap:7px}.top-action:hover{background:var(--hover)}.content{flex:1;overflow-y:auto;scroll-behavior:smooth}.welcome{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 20px 130px}.welcome h1{font-size:30px;letter-spacing:-.8px;font-weight:600;margin:0 0 28px;text-align:center}.composer-wrap{width:min(100%,770px)}.composer{border:1px solid var(--line);border-radius:28px;padding:12px 13px 10px;background:var(--bg);box-shadow:0 2px 8px #00000008}.composer textarea{width:100%;border:0;outline:none;resize:none;background:transparent;color:var(--text);font-size:16px;line-height:1.5;min-height:28px;max-height:200px;padding:2px 5px}.composer textarea::placeholder{color:var(--muted)}.composer-bottom{display:flex;align-items:center;justify-content:space-between;margin-top:7px}.compose-left,.compose-right{display:flex;align-items:center;gap:5px}.round-btn{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}.round-btn:hover{background:var(--hover);color:var(--text)}.tool-btn{border-radius:999px;padding:7px 10px;display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}.tool-btn:hover{background:var(--hover);color:var(--text)}.send-btn{width:34px;height:34px;border-radius:50%;background:var(--text);color:var(--bg);display:grid;place-items:center}.send-btn:disabled{opacity:.35;cursor:default}.suggestions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:22px}.suggestion{border:1px solid var(--line);border-radius:15px;padding:13px 15px;text-align:left;font-size:13px;color:var(--muted);line-height:1.4}.suggestion strong{display:block;color:var(--text);font-weight:500;font-size:14px;margin-bottom:3px}.suggestion:hover{background:var(--hover)}.chat{width:min(100%,770px);margin:0 auto;padding:26px 20px 180px}.message{margin:0 0 28px;display:flex;flex-direction:column;align-items:flex-start}.message.user{align-items:flex-end}.bubble{max-width:88%;font-size:16px;line-height:1.7;white-space:pre-wrap;overflow-wrap:anywhere}.user .bubble{background:var(--user);padding:11px 17px;border-radius:22px;line-height:1.55}.assistant .bubble{max-width:100%}.message-tools{display:flex;gap:5px;margin-top:8px;opacity:.75}.message-tools button{font-size:12px;color:var(--muted);padding:5px 7px;border-radius:7px}.message-tools button:hover{background:var(--hover)}.bottom-composer{position:absolute;bottom:0;left:0;right:0;padding:16px 20px 12px;background:linear-gradient(transparent,var(--bg) 18%)}.bottom-composer .composer-wrap{margin:auto}.disclaimer{text-align:center;color:var(--muted);font-size:11px;margin-top:10px}.typing{display:flex;gap:5px;padding:10px 2px}.typing span{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:pulse 1s infinite}.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}@keyframes pulse{0%,80%,100%{opacity:.3;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}.menu{position:absolute;top:48px;left:20px;background:var(--bg);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:14px;padding:6px;width:210px;z-index:20;display:none}.menu.open{display:block}.menu button{width:100%;padding:10px;border-radius:8px;text-align:left;font-size:13px}.menu button:hover{background:var(--hover)}.menu button span{display:block;color:var(--muted);font-size:11px;margin-top:3px}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:13px;z-index:30;display:none}.toast.show{display:block}.overlay{display:none}
@media(max-width:760px){.sidebar{position:fixed;inset:0 auto 0 0;width:270px;transform:translateX(-100%);box-shadow:var(--shadow)}.sidebar.open{transform:translateX(0)}.overlay.show{display:block;position:fixed;inset:0;background:#0005;z-index:9}.mobile-menu{display:grid}.topbar{padding:0 10px}.top-action{padding:7px 9px}.top-action .hide-small{display:none}.welcome{padding-bottom:105px}.welcome h1{font-size:25px}.suggestions{grid-template-columns:1fr}.chat{padding:20px 16px 170px}.bubble{font-size:15px;max-width:94%}.bottom-composer{padding:12px 10px 8px}.tool-btn{font-size:12px;padding:7px}.top-right{gap:2px}}@media(max-height:650px){.welcome{padding-top:25px;justify-content:flex-start}.welcome h1{margin-top:20px}}
</style>
</head>
<body>
<div class="app">
 <aside class="sidebar" id="sidebar">
  <div class="side-top"><button class="brandmark" aria-label="Home" onclick="newChat()" title="New chat">✳</button><button class="icon-btn" onclick="toggleSidebar()" aria-label="Close sidebar"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg></button></div>
  <button class="side-action" onclick="newChat()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L9 17l-4 1 1-4Z"/></svg>New chat</button>
  <button class="side-action" onclick="showToast('Search is a demo feature.')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>Search chats</button>
  <button class="side-action" onclick="showToast('Explore GPTs is a demo feature.')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="m12 3 2.2 6.8L21 12l-6.8 2.2L12 21l-2.2-6.8L3 12l6.8-2.2Z"/></svg>Explore GPTs</button>
  <div class="history-label">Your chats</div><div class="history" id="history"></div>
  <div class="profile"><button onclick="toggleTheme()"><span class="avatar">S</span><span><span class="profile-name">Sankalp</span><span class="profile-sub">Personal · Demo</span></span><span style="margin-left:auto;color:var(--muted)">•••</span></button></div>
 </aside>
 <div class="overlay" id="overlay" onclick="toggleSidebar()"></div>
 <main class="main">
  <header class="topbar"><div class="top-left"><button class="icon-btn mobile-menu" onclick="toggleSidebar()" aria-label="Open sidebar">☰</button><button class="model-btn" id="modelBtn" onclick="toggleModelMenu()">ChatGPT <small>⌄</small></button></div><div class="top-right"><button class="top-action" onclick="showToast('This is a local demo. No account is connected.')"><span>↗</span><span class="hide-small">Share</span></button><button class="icon-btn" onclick="toggleTheme()" aria-label="Toggle theme" title="Toggle theme">◐</button></div></header>
  <div class="menu" id="modelMenu"><button onclick="setModel('ChatGPT')">ChatGPT <span>General purpose · Demo</span></button><button onclick="setModel('Reasoning')">Reasoning <span>Deeper thinking · Demo</span></button><button onclick="setModel('Fast')">Fast <span>Quick responses · Demo</span></button></div>
  <section class="content" id="content"><div class="welcome" id="welcome"><h1>What can I help with?</h1><div class="composer-wrap"><div class="composer"><textarea id="welcomeInput" rows="1" placeholder="Message ChatGPT" aria-label="Message ChatGPT"></textarea><div class="composer-bottom"><div class="compose-left"><button class="round-btn" onclick="showToast('Attachment upload is not connected in this demo.')" title="Attach files">＋</button><button class="tool-btn" onclick="showToast('Search is a demo feature.')">⌕ <span>Search</span></button><button class="tool-btn" onclick="showToast('Thinking mode is simulated in this demo.')">◈ <span>Reason</span></button></div><div class="compose-right"><button class="round-btn" onclick="showToast('Voice is not connected in this demo.')" title="Voice">♩</button><button class="send-btn" id="welcomeSend" onclick="sendFrom('welcomeInput')" aria-label="Send" disabled><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button></div></div></div><div class="suggestions"><button class="suggestion" onclick="useSuggestion('Help me understand a difficult topic')"><strong>📚 Learn something</strong>Explain a difficult topic simply</button><button class="suggestion" onclick="useSuggestion('Help me write a polished email')"><strong>✍️ Write something</strong>Draft, edit, or improve your writing</button><button class="suggestion" onclick="useSuggestion('Give me creative ideas for a project')"><strong>💡 Get inspired</strong>Brainstorm ideas and explore options</button><button class="suggestion" onclick="useSuggestion('Help me plan my week')"><strong>🗓️ Make a plan</strong>Organize tasks and make a plan</button></div></div></div></section>
  <div class="bottom-composer" id="bottomComposer" style="display:none"><div class="composer-wrap"><div class="composer"><textarea id="chatInput" rows="1" placeholder="Message ChatGPT" aria-label="Message ChatGPT"></textarea><div class="composer-bottom"><div class="compose-left"><button class="round-btn" onclick="showToast('Attachment upload is not connected in this demo.')" title="Attach files">＋</button><button class="tool-btn" onclick="showToast('Search is a demo feature.')">⌕ <span>Search</span></button><button class="tool-btn" onclick="showToast('Thinking mode is simulated in this demo.')">◈ <span>Reason</span></button></div><div class="compose-right"><button class="round-btn" onclick="showToast('Voice is not connected in this demo.')" title="Voice">♩</button><button class="send-btn" id="chatSend" onclick="sendFrom('chatInput')" aria-label="Send" disabled><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button></div></div></div><div class="disclaimer">ChatGPT can make mistakes. Check important info.</div></div></div>
 </main>
</div><div class="toast" id="toast"></div>
<script src="https://js.puter.com/v2/"></script>
<script>
const $=id=>document.getElementById(id);let chats=[],activeId=null,model='ChatGPT',toastTimer;
function uid(){return 'c'+Date.now()+Math.random().toString(16).slice(2,6)}
function escapeHTML(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function showToast(msg){$('toast').textContent=msg;$('toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.remove('show'),2300)}
function toggleSidebar(){$('sidebar').classList.toggle('open');$('overlay').classList.toggle('show')}
function toggleTheme(){document.body.classList.toggle('dark')}
function toggleModelMenu(){$('modelMenu').classList.toggle('open')}
function setModel(m){model=m;$('modelBtn').innerHTML=escapeHTML(m)+' <small>⌄</small>';$('modelMenu').classList.remove('open')}
function newChat(){activeId=null;$('welcome').style.display='flex';$('bottomComposer').style.display='none';$('content').innerHTML='';$('content').appendChild($('welcome'));$('welcomeInput').value='';resize($('welcomeInput'));renderHistory();if(innerWidth<=760){$('sidebar').classList.remove('open');$('overlay').classList.remove('show')}}
function useSuggestion(t){$('welcomeInput').value=t;resize($('welcomeInput'));$('welcomeSend').disabled=false;$('welcomeInput').focus()}
function resize(el){el.style.height='auto';el.style.height=Math.min(el.scrollHeight,200)+'px';let b=el.id==='welcomeInput'?'welcomeSend':'chatSend';$(b).disabled=!el.value.trim()}
['welcomeInput','chatInput'].forEach(id=>{const el=$(id);el.addEventListener('input',()=>resize(el));el.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendFrom(id)}})});
function sendFrom(id){const input=$(id),text=input.value.trim();if(!text)return;input.value='';resize(input);if(!activeId){activeId=uid();chats.unshift({id:activeId,title:text.length>30?text.slice(0,30)+'…':text,messages:[]});$('welcome').style.display='none';$('bottomComposer').style.display='block';renderChatShell();}const chat=chats.find(c=>c.id===activeId);chat.messages.push({role:'user',text});renderMessages();renderHistory();setTimeout(()=>respond(chat.id,text),650)}
function renderChatShell(){const content=$('content');content.innerHTML='<div class="chat" id="chatMessages"></div>'; $('bottomComposer').style.display='block';}
function renderMessages(){const chat=chats.find(c=>c.id===activeId);if(!$('chatMessages'))renderChatShell();$('chatMessages').innerHTML=chat.messages.map((m,i)=>`<div class="message ${m.role}"><div class="bubble">${escapeHTML(m.text)}</div>${m.role==='assistant'?`<div class="message-tools"><button onclick="copyText(${JSON.stringify(m.text).replace(/</g,'\\u003c')})">▢ Copy</button><button onclick="showToast('Regeneration is simulated in this demo.')">↻ Regenerate</button><button onclick="showToast('Thanks for the feedback!')">♡</button></div>`:''}</div>`).join('');$('content').scrollTop=$('content').scrollHeight}
async function respond(id,userText){
  const chat=chats.find(c=>c.id===id);
  if(!chat || activeId!==id) return;

  const node=document.createElement('div');
  node.className='message assistant';
  node.id='typing';
  node.innerHTML='<div class="typing"><span></span><span></span><span></span></div>';
  if($('chatMessages')) $('chatMessages').appendChild(node);
  $('content').scrollTop=$('content').scrollHeight;

  try {
    if(!window.puter || !puter.ai || typeof puter.ai.chat!=='function') {
      throw new Error('Puter.js did not load. Check your internet connection and reload the page.');
    }

    // Send the full conversation so the model can use prior context.
    const messages=chat.messages.map(m=>({
      role:m.role,
      content:m.text
    }));

    const response=await puter.ai.chat(messages,{
      model:'google/gemini-3.8-flash'
    });

    const reply=extractPuterText(response);
    if(!reply) throw new Error('The model returned an empty response.');
    if(activeId!==id) return;

    const typing=$('typing');
    if(typing) typing.remove();
    chat.messages.push({role:'assistant',text:reply});
    renderMessages();
  } catch(error) {
    const typing=$('typing');
    if(typing) typing.remove();
    if(activeId!==id) return;
    const detail=(error && error.message) ? error.message : String(error);
    chat.messages.push({
      role:'assistant',
      text:'I couldn’t get a response from the model.\n\nError: '+detail+'\n\nCheck your connection and that Puter.js supports the selected model, then try again.'
    });
    renderMessages();
  }
}
function extractPuterText(response){
  const content=response?.message?.content ?? response?.content ?? response?.text ?? '';
  if(typeof content==='string') return content.trim();
  if(Array.isArray(content)) {
    return content.map(part=>{
      if(typeof part==='string') return part;
      return part?.text ?? part?.content ?? '';
    }).join('\n').trim();
  }
  return String(content ?? '').trim();
}
function renderHistory(){$('history').innerHTML=chats.map(c=>`<button class="history-item" onclick="openChat('${c.id}')">${escapeHTML(c.title)}</button>`).join('')}
function openChat(id){activeId=id;$('welcome').style.display='none';renderChatShell();renderMessages();if(innerWidth<=760)toggleSidebar()}
function copyText(t){if(navigator.clipboard)navigator.clipboard.writeText(t).then(()=>showToast('Copied to clipboard'));else showToast('Clipboard unavailable in this browser')}
$('welcomeInput').addEventListener('input',()=>{$('welcomeSend').disabled=!$('welcomeInput').value.trim()});renderHistory();
document.addEventListener('click',e=>{if(!$('modelMenu').contains(e.target)&&!$('modelBtn').contains(e.target))$('modelMenu').classList.remove('open')});
</script>
</body>
</html>
